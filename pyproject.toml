[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-website-workflow"
version = "0.1.0"
description = "Portable, approval-gated multi-agent static website production"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qa = ["playwright>=1.50,<2"]

[project.scripts]
website-workflow = "website_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["website_workflow*"]
